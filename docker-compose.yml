version: "3.8"

services:
  sqlserver:
    container_name: sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "123456aA@"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - studymate-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "123456aA@", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    container_name: studymate_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "7259:7259" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # Cổng 7259 phải để https mới khớp với chứng chỉ
      - ASPNETCORE_URLS=https://+:7259;http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Password=123456
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=StudyMate;User Id=sa;Password=123456aA@;TrustServerCertificate=True;MultipleActiveResultSets=True
      - AppSettings__BaseUrl=https://localhost:7259
    volumes:
      # Lệnh này đưa file aspnetapp.pfx từ máy bạn vào container
      - .:/https:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - studymate-network
    restart: unless-stopped

networks:
  studymate-network:
    driver: bridge

volumes:
  sqlserver_data: